<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Todoku</title>
  <meta name="description" content="Todoku — Communication Hub. Em breve.">
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #0b0d0c;
      background-image: radial-gradient(circle at 50% 40%, #151a17 0%, #0b0d0c 70%);
      color: #f3f5f3;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      padding: 24px;
      text-align: center;
      overflow: hidden;
    }

    main {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }

    h1 {
      font-size: clamp(3rem, 10vw, 5.5rem);
      font-weight: 600;
      letter-spacing: -0.04em;
      line-height: 1;
      color: #fafbfa;
    }

    p {
      font-size: clamp(1rem, 3vw, 1.25rem);
      font-weight: 400;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: #8c938e;
    }
  </style>
</head>
<body>
  <main>
    <h1>Todoku</h1>
    <p>Em breve</p>
  </main>
</body>
</html>
